# md3Music native 工程 version catalog
# 版本选取原则（2026-10-12，均以 Maven Central / Google Maven 实际可解析为准）：
#   - agp 9.0.1 / kotlin 2.3.20 与 Flutter 工程锁定一致（不得更改）；
#   - AGP 9.0.1 + compileSdk 36 为硬约束：androidx 各产线取「AAR 元数据
#     minCompileSdk<=36 且 minAgp<=9.0.1」的最新稳定版（2026-09 起的 1.12.x/2.11.x
#     等新版本要求 API 37 + AGP 9.1.0，不可用）；
#   - ksp 取基于 Kotlin 2.3.20 构建的最新匹配版；media3 锁定 1.4.1 对齐 fork。

[versions]
agp = "9.0.1"
kotlin = "2.3.20"
# KSP 2.3.12 的 POM 依赖 kotlin-stdlib 2.3.20，为 Central 上可解析的最新匹配版
# （KSP 2.3.0 起改用独立序号，旧式 "2.3.20-*" 双段号已不再发布）
ksp = "2.3.12"
# Compose BOM 2026.06.01 -> compose 1.11.4 / material3 1.4.0（AAR 元数据 35/8.6.0）；
# 2026.08/09 的 1.12.x 要求 API 37 + AGP 9.1.0，与锁定工具链冲突
composeBom = "2026.06.01"
hilt = "2.60.1"
# 1.4.0 要求 API 37 + AGP 9.1.0；1.3.0 为兼容版（35/8.6.0）
hiltNavigationCompose = "1.3.0"
room = "2.8.5"
retrofit = "2.12.0"
okhttp = "4.12.0"
# coil 3.6.x 要求 API 37；3.5.0 为兼容版（36/1.0.0）
coil = "3.5.0"
datastore = "1.2.1"
securityCrypto = "1.1.0"
work = "2.12.0"
palette = "1.0.0"
# navigation 2.10.x 要求 API 37 + AGP 9.1.0；2.9.7 为兼容版（35/8.6.0）
navigationCompose = "2.9.7"
# lifecycle 2.11.0 要求 API 37 + AGP 9.1.0；2.10.0 为兼容版（35/8.6.0）
lifecycle = "2.10.0"
activityCompose = "1.13.0"
# core-ktx 1.19.x 要求 API 37 + AGP 9.1.0；1.18.0 为兼容版（36/8.9.1）
coreKtx = "1.18.0"
coroutines = "1.11.0"
serializationJson = "1.11.0"
# Media3 锁定 1.4.1：与 just_audio fork 内嵌源码版本对齐，不得随官方新版浮动
media3 = "1.4.1"
junit = "4.13.2"
robolectric = "4.17"

[libraries]
# --- Compose（版本统一由 compose-bom 平台管控，条目不写 version）---
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }

# --- AndroidX 基础 ---
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
androidx-palette-ktx = { group = "androidx.palette", name = "palette-ktx", version.ref = "palette" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
androidx-security-crypto = { group = "androidx.security", name = "security-crypto", version.ref = "securityCrypto" }
androidx-work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "work" }
androidx-hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "hiltNavigationCompose" }

# --- DI（Hilt，KSP 处理）---
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "hilt" }

# --- 数据库（Room，KSP 处理）---
room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }

# --- 网络（Retrofit 2 + OkHttp 4 + kotlinx.serialization）---
retrofit = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
retrofit-converter-kotlinx-serialization = { group = "com.squareup.retrofit2", name = "converter-kotlinx-serialization", version.ref = "retrofit" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
okhttp-mockwebserver = { group = "com.squareup.okhttp3", name = "mockwebserver", version.ref = "okhttp" }

# --- 播放（Media3 锁定 1.4.1）---
media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
media3-session = { group = "androidx.media3", name = "media3-session", version.ref = "media3" }
media3-common = { group = "androidx.media3", name = "media3-common", version.ref = "media3" }
# :app 显式依赖 media3-decoder：LibflacAudioRenderer 的父类链签名出现
# androidx.media3.decoder.SimpleDecoder，需在其编译类路径可见（:media3fork 以
# implementation 声明故不外泄）。
media3-decoder = { group = "androidx.media3", name = "media3-decoder", version.ref = "media3" }
# --- androidx.core（core 明文条目供 :media3fork 使用）---
# :media3fork 编译 vendored media3-session，其中 NotificationCompat.Builder
# #setForegroundServiceBehavior / #setSilent 等为 androidx.core 1.7.0+ API；
# 而 androidx.media:media:1.7.0 的传递依赖把 core 拉到 1.6.0（编译失败）。
# Flutter 侧由 core-ktx 1.12.0 抬升到 ≥1.7.0 故不暴露；native 工程需显式声明。
# 版本与 app 的 core-ktx 保持一致（同一 coreKtx 版本号）。
androidx-core = { group = "androidx.core", name = "core", version.ref = "coreKtx" }

# --- 图片（Coil 3，网络加载需显式 okhttp 组件）---
coil-compose = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coil" }
coil-network-okhttp = { group = "io.coil-kt.coil3", name = "coil-network-okhttp", version.ref = "coil" }

# --- 异步 / 序列化 ---
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serializationJson" }

# --- 测试 ---
junit = { group = "junit", name = "junit", version.ref = "junit" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
