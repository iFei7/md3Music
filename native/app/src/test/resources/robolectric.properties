# Robolectric 测试 SDK 固定。
#
# 为什么不依赖默认值：Robolectric 默认按 targetSdk（本工程 35）申请 android-all 运行时，
# 在无法获取该版本时会**静默回退到本地已有的最低版本**（本机缓存里存在
# android-all-6.0.1_r3，即 API 23）。后果是测试在一个**低于本工程 minSdk(24)** 的
# 框架上运行：API 26+ 的类（NotificationChannel 等）直接 NoSuchMethodError，
# 资源表也与编译目标不匹配（Resources$NotFoundException）。
#
# 固定为 API 32（android-all-12）的三条理由：
# 1. 高于 minSdk 24，能真实覆盖渠道/前台服务/通知等 26+ 才存在的能力；
# 2. 本地已缓存，离线可复现；
# 3. 处在目标适配区间（Android 12–14）内，与真机验证的主要机型一致。
sdk=32
