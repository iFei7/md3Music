name: md3music
description: "Grace Music - Music player with Material Design 3"
publish_to: 'none'
version: 6.0.0+93

environment:
  sdk: ^3.12.0

# 依赖钉扎（构建号 109/111 事故）：shared_preferences_android 2.5.0
# （2026-10-17 03:20Z 发布，内部实现迁移 Pigeon JNI）导致 release 包
# 真机卡启动画面（首帧不渲染）；105 及之前的构建用 2.4.28 均正常。
# pubspec.lock 已入库防复发；待上游修复后移除本 override。
dependency_overrides:
  shared_preferences_android: 2.4.28
  shared_preferences_foundation: 2.5.7
  # 批次50：钉住 material_ui 1.7.0（与上游 rust-local-force 同款 override）：
  # 1.8.0 新导出 RoundedPolygon/CornerRounding（src/shapes/），与 m3e_core
  # 1.1.4 自带的同名符号冲突（"'RoundedPolygon' is imported from both ..."
  # 编译错误）。dependencies 约束 ^1.3.0 本身允许 1.7.0，此钉只为禁止 pub
  # 自动升到 1.8+；material_ui 修复合并后可移除。TV 版 UI（lib/tv_ui/）
  # 按上游 1.7.0 API 编写。
  material_ui: 1.7.0

dependencies:
  flutter:
    sdk: flutter

  # just_audio 0.10.6 本地 fork：注入可拦截 AudioSink 的 RenderersFactory（USB 独占输出）
  just_audio:
    path: third_party/just_audio
  audio_session: ^0.1.18
  http: ^1.2.1
  provider: ^6.1.2
  cached_network_image: ^3.3.1
  sensors_plus: ^7.1.0
  crypto: ^3.0.3
  flutter_cache_manager: ^3.4.1
  shared_preferences: ^2.5.0
  permission_handler: ^12.0.0
  record: ^6.1.1
  path_provider: ^2.1.0
  quick_actions: ^1.0.7
  intl: ^0.20.2
  dio: ^5.4.0
  url_launcher: ^6.3.0
  package_info_plus: ^10.2.1
  ffi: ^2.1.0
  palette_generator: ^0.3.3+7
  dynamic_color: ^1.7.0
  material_color_utilities: ^0.13.0
  audio_metadata_reader: ^1.4.1
  dlna_dart: ^0.1.0
  flutter_secure_storage: ^10.3.1
  # 原生 Toast 提示（替代 SnackBar 通知）；10.0.0 起 compileSdk 满足项目 36 要求
  fluttertoast: ^10.0.0
  # TTML 歌词解析：Apple Music 风格 XML（Timed Text Markup Language）
  xml: ^6.5.0
  m3e_core: ^1.1.4
  # Material 库已解耦为独立包；m3e_core 1.1.0+ 要求 Flutter >=3.47.0 且依赖
  # material_ui ^1.3.0。注意 material_ui 声明的 flutter ">=3.44.0" 不准确：
  # 1.3.0 用了 @awaitNotRequired，该符号只在 3.47+ 的 foundation.dart
  # 导出列表中提供，3.44.x 上会编译失败（Undefined name 'awaitNotRequired'）。
  material_ui: ^1.3.0
  # AM 播放器传输按钮：路径级矢量图标形变（play↔pause 连续 morph + prev/next 描边动画）
  # 纯 Dart、零外部依赖，仅需自带 24x24 描边 SVG
  iconic_morph: ^1.9.0
  # 网络类型检测（WiFi / 移动网络）：音质按网络分别设置
  connectivity_plus: ^7.0.0
  # 图片选择（外部歌单截图导入）
  image_picker: ^1.1.2
  # 诊断日志导出：系统分享面板（Android ACTION_SEND / Windows 系统分享），自带 FileProvider
  share_plus: ^13.3.0
  # 诊断日志导出：纯 Dart zip 打包（无原生代码，跨平台）
  archive: ^4.0.7
  # 批次43：TV 遥控器 D-pad 导航（fluttercandies）。仅 --dart-define=MD3_TV=true
  # 的 TV 构建实际编入；正常构建 kTvBuild 恒为 false，TV 代码全部 const 分支
  # 被 AOT 树摇剔除，本包只进依赖图不进产物。
  dpad: ^3.0.0

  # 批次50：TV 版 UI（lib/tv_ui/，上游 rust-local-force 全量闭包）所需依赖，
  # 版本/写法与上游 pubspec 对齐；手机构建不引用（kTvBuild 树摇），只进依赖图。
  sqflite: 2.3.3+1
  # 听歌统计本地库：Windows/Linux 桌面 FFI 实现（移动端仍走 sqflite 平台实现）
  sqflite_common_ffi: ^2.3.3
  # MV 播放页（上游 tv_ui 闭包内 mv_player_page 等）
  video_player: ^2.9.2
  chewie: ^1.8.5
  video_player_win: ^3.2.2
  # MV 弹幕层（上游 tv_ui 闭包内 widgets/danmaku/）
  canvas_danmaku: ^0.3.3
  # 榜单/搜索 Web 预览（上游 tv_ui 闭包内 sheet_square_page 等）
  webview_flutter: ^4.10.0
  # 3D 封面 Windows 侧推理：纯 Dart ONNX Runtime 绑定（vendored 自 onnxruntime_plus
  # 1.5.0 的 lib/src，**不是 plugin**，不会给 Android 注入 onnxruntime so）
  ort_dart:
    path: third_party/ort_dart
  just_audio_windows:
    path: third_party/just_audio_windows
  # 3D 封面 Windows 侧的 PNG 编解码 + 双线性缩放（纯 Dart、MIT，唯一依赖 archive）
  image: ^4.12.0
  # 拼音检索排序（上游 tv_ui 闭包内 utils/playlist_song_sort）
  pinyin: ^3.3.0
  # 桌面端文件选择（自定义字体导入 / 背景图加载，上游 tv_ui 闭包内 services）
  file_selector: ^1.1.0
  # M3 Expressive 组件库（上游 tv_ui 闭包内 m3e_undo_pill_host 等）
  m3_expressive: ^1.0.0
  # 酷狗登录 cookie 管理（上游 kugou_api 体系，tv_ui 副本引用）
  dio_cookie_manager: ^3.1.1
  cookie_jar: ^4.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_async: ^1.3.1
  analyzer: ^10.2.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/web/
